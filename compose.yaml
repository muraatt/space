# Reserved infrastructure profile; Session 1 runs native Node/Vite.
# Database application integration is Session 5.
services:
  postgres:
    image: postgres:18.6-alpine
    profiles: [session5]
    environment:
      POSTGRES_USER: orbital
      POSTGRES_DB: orbital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password for Session 5}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['orbital-data:/var/lib/postgresql']
volumes:
  orbital-data:
