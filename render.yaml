services:
  - type: web
    name: orbital-authority
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.authority
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: orbital-identity-db
          property: connectionString
      # Render is the only trusted HTTP/WebSocket proxy in front of this service.
      - key: TRUST_PROXY
        value: "1"

databases:
  - name: orbital-identity-db
    plan: free
