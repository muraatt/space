services:
  - type: web
    name: orbital-authority
    runtime: docker
    dockerfilePath: ./Dockerfile.authority
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: IDENTITY_STORE_PATH
        value: /data/identities.json
    disk:
      name: orbital-identity
      mountPath: /data
      sizeGB: 1
